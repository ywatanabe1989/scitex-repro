name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 7 * * *"  # nightly 07:00 UTC
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps + test plugins
        run: |
          pip install --upgrade pip
          pip install pytest pytest-cov pytest-timeout
          pip install -e ".[dev]" || pip install -e .
      - name: Lint with scitex-linter (non-fatal)
        # TODO: flip `continue-on-error: false` once existing EH001 / other
        # violations are addressed. Initially rolled out as advisory so the
        # new STX-EH001 rule (and other future rules) does not break CI
        # overnight. See scitex-linter feat/eh001-narrow-import-except.
        continue-on-error: true
        run: |
          pip install scitex-linter || pip install git+https://github.com/ywatanabe1989/scitex-linter@develop
          scitex-linter check src/
      - name: Detect import name
        id: pkg
        run: |
          IMPORT_NAME=$(find src -maxdepth 2 -name __init__.py -printf '%h\n' | head -1 | xargs -n1 basename)
          echo "import_name=${IMPORT_NAME}" >> "$GITHUB_OUTPUT"
      - name: Run tests with coverage
        run: |
          python -m pytest "$GITHUB_WORKSPACE/tests/" -v --tb=short --timeout=120 \
            --cov=src/${{ steps.pkg.outputs.import_name }} \
            --cov-report=xml --cov-report=term
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

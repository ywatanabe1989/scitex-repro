name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 7 * * *"  # nightly 07:00 UTC
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 dropped — zarr>=3 (transitively pulled by some peers)
        # requires 3.11+. scitex-repro has no zarr surface but the
        # ecosystem-wide matrix is 3.11–3.13 (see skill leaf
        # 02_package_11_ci-and-codecov.md).
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps + test plugins
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-timeout
          pip install -e ".[all,dev]" || pip install -e ".[dev]" || pip install -e .
      - name: Lint with scitex-linter (non-fatal)
        # TODO: flip `continue-on-error: false` once existing EH001 / other
        # violations are addressed. Initially rolled out as advisory so the
        # new STX-EH001 rule (and other future rules) does not break CI
        # overnight. See scitex-linter feat/eh001-narrow-import-except.
        continue-on-error: true
        run: |
          pip install scitex-linter || pip install git+https://github.com/ywatanabe1989/scitex-linter@develop
          scitex-linter check src/
      - name: Run tests with coverage
        run: |
          python -m pytest "$GITHUB_WORKSPACE/tests/" -v --tb=short --timeout=120 \
            --cov=src/scitex_repro \
            --cov-report=xml --cov-report=term
      - name: Upload coverage to Codecov
        # `if: always()` keeps coverage flowing even when tests fail —
        # otherwise Actions implicitly evaluates success() and skips the
        # upload exactly when you most want to see the number.
        if: always() && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  install-check:
    # Catches undeclared runtime deps that the package's own test suite
    # misses. A package can build, upload, and pass its own tests with a
    # wrong pyproject.toml — the bug only shows up when a fresh user runs
    # `pip install <pkg>` in a clean venv. This job reproduces that path.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: Install + import in a fresh venv
        run: |
          python -m venv /tmp/clean-venv
          /tmp/clean-venv/bin/pip install --upgrade pip
          /tmp/clean-venv/bin/pip install dist/*.whl
          /tmp/clean-venv/bin/python -c "import scitex_repro; print(f'OK: {scitex_repro.__name__}')"

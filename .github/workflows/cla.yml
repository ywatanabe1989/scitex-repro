name: CLA Assistant

# PILOT: org-level reusable-workflow caller (scitex-ai/.github, 2026-07-10).
# Triggers/permissions preserved verbatim from the prior local file.
# This repo's prior allowlist included an extra login (LLEmacs) beyond the
# reusable default ("bot*,ywatanabe1989") — overridden via `with:` below
# so the allowlist behavior is unchanged.
# NOTE: this repo's on: has no `push` trigger, so the reusable's
# owner-bypass job (guarded by `if: github.event_name == 'push'`) never
# fires here — same as before (this repo never had an owner-bypass job).

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  call:
    uses: scitex-ai/.github/.github/workflows/cla.yml@main
    # NAMED SECRET, not `inherit`. This caller runs on `issue_comment` and
    # `pull_request_target` -- both unauthenticated on a public repo -- and
    # `secrets: inherit` forwards EVERY secret this repo holds into a job an
    # outsider can start, on the shared self-hosted runner the callee targets.
    # Neither file shows that on its own: the caller names no runs-on, so the
    # destination lives in the callee. Pass only the secret the callee declares.
    secrets:
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
    with:
      owner_allowlist: "bot*,ywatanabe1989,LLEmacs"

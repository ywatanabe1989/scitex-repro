[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scitex-repro"
version = "0.1.0"
description = "Reproducibility utilities (random state, timestamps, hashing)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Yusuke Watanabe" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy",
]

[project.optional-dependencies]
torch = ["torch"]
tensorflow = ["tensorflow"]
jax = ["jax", "jaxlib"]
all = ["torch", "tensorflow", "jax", "jaxlib"]

[project.urls]
Homepage = "https://github.com/ywatanabe1989/scitex-repro"
Repository = "https://github.com/ywatanabe1989/scitex-repro"
